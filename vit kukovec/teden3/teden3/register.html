<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registracija - Moji stroški</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">💰 Moji stroški</div>
    <h1 class="auth-title">Registracija</h1>
    <p class="auth-sub">Ustvarite brezplačen račun za sledenje svojim stroškom.</p>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="regUsername">Uporabniško ime</label>
        <input type="text" id="regUsername" name="username" autocomplete="username" minlength="3" maxlength="50" required>
        <small>3-50 znakov: črke, številke, "_", "." ali "-".</small>
      </div>
      <div class="field">
        <label for="regEmail">E-poštni naslov</label>
        <input type="email" id="regEmail" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="regPassword">Geslo</label>
        <input type="password" id="regPassword" name="password" autocomplete="new-password" minlength="8" required>
        <small>Vsaj 8 znakov, vsaj ena črka in ena številka. Geslo bo shranjeno zgoščeno (hash), nikoli v čisti obliki.</small>
      </div>
      <div class="field">
        <label for="regPassword2">Ponovite geslo</label>
        <input type="password" id="regPassword2" name="password2" autocomplete="new-password" minlength="8" required>
      </div>

      <p class="auth-error" id="registerError" hidden></p>

      <button type="submit" class="btn btn--primary auth-submit" id="registerSubmit">Ustvari račun</button>
    </form>

    <p class="auth-switch">Že imate račun? <a href="login.html">Prijavite se</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
